<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN-Statistik</title>
<link rel="icon" id="fav" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#16181d;--mute:#5d6472;--line:#e3e6ec;--grid:#eceef2;--acc:#3b6cf6;--soft:#eef1f6;
 --ok:#18a058;--warn:#b26a00;--bad:#d03050;--s1:#2a78d6;--s2:#eb6834;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--bg:#0f1115;--card:#171a21;--ink:#e8eaf0;--mute:#9aa3b2;--line:#262b35;--grid:#20242d;--acc:#6f95ff;--soft:#1e222b;
 --ok:#36c27a;--warn:#f0a72a;--bad:#ff5c7a;--s1:#3987e5;--s2:#d95926;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a21;--ink:#e8eaf0;--mute:#9aa3b2;--line:#262b35;--grid:#20242d;--acc:#6f95ff;--soft:#1e222b;
 --ok:#36c27a;--warn:#f0a72a;--bad:#ff5c7a;--s1:#3987e5;--s2:#d95926;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 50px}
.nav{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
h1{font-size:28px;margin:12px 0 0;letter-spacing:-.02em}
h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));margin-top:18px}
.kpi .l{color:var(--mute);font-size:13px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.kpi .s{color:var(--mute);font-size:12.5px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}
/* Handy: Kennzahlen zu zweit nebeneinander, etwas kleiner; kleinere Ränder */
@media (max-width:480px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpis .card{padding:12px}
  .kpi .v{font-size:21px}
  .kpi .s{font-size:12px}
  h1{font-size:24px}
  .card{padding:14px;border-radius:14px}
}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ttl{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.mute{color:var(--mute);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.on{background:var(--ok)}.off{background:var(--line)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}
.kv div{background:var(--soft);border-radius:10px;padding:7px 9px;min-width:0}
.kv b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv span{white-space:nowrap;font-size:12px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--mute);margin:2px 4px 2px 0}
.geo{font-size:13.5px;margin:4px 0 2px;min-height:0}.geo:empty{display:none}.geo a{color:var(--acc)}.geo .pos{margin-bottom:2px}
.vtag{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute);margin-left:10px;vertical-align:4px;white-space:nowrap}
.badge.warn{color:var(--warn)}.badge.ok{color:var(--ok)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:220px;overflow:visible}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-bottom:6px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.rect{height:10px;width:10px;border-radius:3px}
.tabs{margin-left:auto;display:flex;gap:4px}
.tabs button{font:inherit;font-size:13px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
.tabs button.act{background:var(--soft);color:var(--ink);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;box-shadow:var(--shadow);display:none;white-space:nowrap;z-index:2}
.tip b{font-variant-numeric:tabular-nums}
.tip .k{display:inline-block;width:12px;height:2px;border-radius:2px;vertical-align:middle;margin-right:6px}
.spark{display:block;width:100%;height:34px;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;border-top:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
[data-m]{display:none}
/* Handy: Tabellen der Verwaltung als Karten (jede Zeile ein Block, Knopf rechts) */
@media (max-width:640px){
  table.resp,table.resp tbody{display:block;width:100%}
  table.resp thead{display:none}
  table.resp tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
  table.resp tr:first-child{border-top:0}
  table.resp td{display:block;border:0;padding:0;text-align:left;white-space:normal;min-width:0;overflow-wrap:anywhere}
  table.resp td[data-l]{font-size:12.5px;color:var(--mute);grid-column:1}
  table.resp td[data-l]::before{content:attr(data-l) ': '}
  table.resp td.act{grid-column:2;grid-row:1 / span 4;text-align:right}
  table.resp td.act .btn2{margin-top:0}
  table.resp [data-m]{display:inline-block}
  table.resp td.stc{display:none}
}
details summary{cursor:pointer;color:var(--mute);font-size:13.5px;margin-top:8px}
.login{max-width:380px;margin:30px auto 0;display:flex;flex-direction:column;gap:10px}
input{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.btn{font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
.err{color:var(--bad);font-size:14px;min-height:1em}
.foot{color:var(--mute);font-size:12.5px;margin-top:22px}
#lg{width:40px;height:40px;border-radius:10px;object-fit:cover;vertical-align:-8px;margin-right:10px}
.set{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.set:first-child{border-top:0;padding-top:2px}
.set .t{flex:1;min-width:0}.set .t b{display:block;font-weight:600}.set .t span{font-size:13px;color:var(--mute)}
.set input[type=text],.set input[type=number]{width:12em;flex:none}.set input[type=number]{width:6em}
.set .pw{display:flex;gap:8px;flex-wrap:wrap;flex:none}.set .pw input{width:11em}
input.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;padding:0;border:0;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
input.sw:checked{background:var(--acc)}input.sw:checked::after{left:21px}input.sw:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--mute);margin-left:6px;font-weight:500;vertical-align:1px}
.setfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
#setrs{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--warn);display:flex;gap:12px;align-items:center;flex-wrap:wrap}#setrs[hidden]{display:none}
@media (max-width:620px){.set{flex-wrap:wrap}.set input[type=text]{width:100%}.set .pw,.set .pw input{width:100%}}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.upl img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--soft)}
.upl label,.upl button{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.pbtns{display:flex;flex-wrap:wrap;gap:0 8px}
.btn2{font:inherit;font-size:13px;padding:5px 11px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;margin-top:8px}
dialog.code{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:18px;max-width:min(420px,calc(100vw - 32px))}
dialog.code::backdrop{background:rgba(0,0,0,.45)}
dialog.map{max-width:min(980px,calc(100vw - 24px));width:min(980px,calc(100vw - 24px));padding:14px}
dialog.map .mh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
dialog.map .mh h3{margin:0;flex:1 1 auto;min-width:8em}
dialog.map .rng{display:flex;flex-wrap:wrap;gap:4px}
dialog.map a.btn2{text-decoration:none;margin-top:0}
dialog.map .rng button{padding:5px 10px;font-size:13px}
dialog.map .rng button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
#map{height:min(68vh,620px);border-radius:12px;border:1px solid var(--line);background:var(--soft)}
dialog.map .mi{font-size:13px;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
dialog.map .lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 0;vertical-align:-1px}
.leaflet-popup-content{font:13px/1.4 system-ui,sans-serif}
dialog.code .qr{background:#fff;border-radius:10px;padding:6px;display:flex;justify-content:center}
dialog.code .qr svg{width:100%;max-width:300px;height:auto}
dialog.code textarea{width:100%;box-sizing:border-box;font:12px ui-monospace,monospace;margin-top:10px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav" id="nav"></div>
  <h1><img id="lg" alt="" hidden><span id="h1">🛡️ KroneVPN – Statistik</span><span class="vtag" id="vtag" hidden></span></h1>
  <div class="sub" id="sub">lädt …</div>
  <div id="main"></div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BASE=location.pathname.replace(/\/+$/,'')+'/';
// Navigation: eingebunden in eine bestehende Werkzeuge-Seite oder eigenstaendig (Link zu den Apps)
(()=>{const n=document.getElementById('nav');const w=location.pathname.startsWith('/werkzeuge/');
  const adm='<a id="navadm" hidden title="Nur erreichbar, wenn dieses Gerät mit dem VPN verbunden ist">🔐 Admin-Seite</a>';
  n.innerHTML=w?'<a href="/">🏠 Home</a><a href="/werkzeuge/">🧰 Werkzeuge</a>'+adm:'<a href="/download/" id="navapps" hidden>📦 Apps</a>'+adm})();
let RANGE='sec', LAST=null, T=null;
try{RANGE=localStorage.getItem('kvpn-range')||'sec'}catch(e){}

function bytes(b){const u=['B','KB','MB','GB','TB'];let i=0;b=+b||0;while(b>=1024&&i<u.length-1){b/=1024;i++}return (i?b.toFixed(b<10?2:1):b)+' '+u[i]}
function rate(Bps){const b=(+Bps||0)*8;return b>=1e9?(b/1e9).toFixed(2)+' Gbit/s':b>=1e6?(b/1e6).toFixed(1)+' Mbit/s':b>=1e3?(b/1e3).toFixed(0)+' kbit/s':b.toFixed(0)+' bit/s'}
function dur(s){s=Math.max(0,s|0);const d=s/86400|0,h=s%86400/3600|0,m=s%3600/60|0;return d?d+' T '+h+' h':h?h+' h '+m+' min':m?m+' min':s+' s'}
function ago(t,now){if(!t)return 'nie';return dur(now-t)+' her'}
function newer(a,b){const p=s=>String(s||'').split('.').map(x=>parseInt(x)||0),x=p(a),y=p(b);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false}
function osName(o){return {android:'Android',windows:'Windows',linux:'Linux',macos:'macOS'}[o]||o||'–'}

async function load(){
  let r,j;
  try{r=await fetch(BASE+'data.json',{cache:'no-store'});j=await r.json();}
  catch(e){$('#sub').textContent='Server nicht erreichbar – neuer Versuch in 5 s';clearTimeout(T);T=setTimeout(load,5000);return;}
  if(r.status===401){BUILT=false;showLogin(j);return;}
  LAST=j;render(j);clearTimeout(T);T=setTimeout(load,2000);
}

/* Die Seite wird EINMAL aufgebaut; danach werden nur Texte, Kurven und Karten an Ort und Stelle geaendert
   (kein Neuaufbau, kein Flackern; offene Tooltips und die aufgeklappte Tabelle bleiben stehen). */
let BUILT=false, TABKEY='', LOGOV=-1;
const setT=(el,v)=>{if(el&&el.textContent!==v)el.textContent=v};
const setH=(el,v)=>{if(el&&el.dataset.h!==v){el.innerHTML=v;el.dataset.h=v}};
function kpi(id,l,s){return '<div class="card kpi"><div class="l">'+esc(l)+'</div><div class="v" id="'+id+'">–</div><div class="s" id="'+id+'s">'+esc(s||'')+'</div></div>'}
function build(){
  $('#main').innerHTML='<div class="kpis">'+kpi('kOn','Verbunden','Geräte gerade online')+kpi('kDown','Download jetzt','Server → Geräte')+kpi('kUp','Upload jetzt','Geräte → Server')+
   kpi('kToday','Heute','Datenmenge aller Geräte')+kpi('kMonth','Dieser Monat','Datenmenge aller Geräte')+kpi('kSrv','Server','')+'</div>'+
   '<h2>Datenrate</h2><div class="card"><div class="legend"><span><i style="background:var(--s1)"></i>Download (zu den Geräten)</span><span><i style="background:var(--s2)"></i>Upload (von den Geräten)</span>'+
   '<div class="tabs" role="group" aria-label="Zeitraum"><button data-r="sec">10 Minuten</button><button data-r="min">24 Stunden</button></div></div><div class="chart" id="chart"></div></div>'+
   '<div id="updbox" class="card" hidden style="margin-top:14px;border-color:var(--acc)"><b id="updt"></b><div class="mute" id="upds" style="margin-top:4px"></div>'+
   '<button class="btn" id="updok" hidden style="margin-top:10px">Jetzt an die Geräte verteilen</button></div>'+
   '<h2>Geräte</h2><div class="grid" id="peers"></div><div class="mute" id="inact" style="margin-top:8px"></div>'+
   '<div id="mgmt" hidden><h2>Benutzer &amp; Geräte sperren</h2><div class="card"><div class="mute" id="mgmtmsg" style="min-height:1.2em"></div>'+
   '<div id="mgmtu"></div><div id="mgmtd" style="margin-top:14px"></div></div></div>'+
   '<h2>Verlauf je Tag</h2><div class="card"><div class="legend"><span><i class="rect" style="background:var(--s1)"></i>Download</span><span><i class="rect" style="background:var(--s2)"></i>Upload</span></div><div class="chart" id="days"></div>'+
   '<details><summary>Tabelle anzeigen</summary><div class="tw" id="dtable"></div></details></div>'+
   '<div id="setbox" hidden><h2>Einstellungen</h2><form class="card" id="setf" autocomplete="off">'+
   '<div class="set"><div class="t"><b>Name des VPN</b><span>erscheint in den Apps, auf den Webseiten und in neuen Codes</span></div><input type="text" id="s_name" maxlength="40"></div>'+
   '<div class="set"><div class="t"><b>Höchstzahl Geräte</b><span id="s_maxi"></span></div><input type="number" id="s_max" min="1"></div>'+
   '<div class="set"><div class="t"><b>Benutzerverwaltung</b><span>Benutzer, sperren, Ablaufdatum und Verlauf (SQLite)</span></div><input type="checkbox" class="sw" id="s_users"></div>'+
   '<div class="set"><div class="t"><b>AES-256-GCM für ältere Apps</b><span>Apps ab 1.1.0 wählen selbst (Auto nach Prozessor oder fest in der App) · das hier gilt nur für Apps bis 1.0.13</span></div><input type="checkbox" class="sw" id="s_aes"></div>'+
   '<div class="set"><div class="t"><b>Leistungsmodus <span class="tag">Neustart</span></b><span>alle CPU-Kerne, mehr Durchsatz, mehr Last</span></div><input type="checkbox" class="sw" id="s_perf"></div>'+
   '<div class="set"><div class="t"><b>Admin-Seite im VPN <span class="tag">Neustart</span></b><span id="s_admi"></span></div><input type="checkbox" class="sw" id="s_admin"></div>'+
   '<div class="set"><div class="t"><b>Standort der Geräte</b><span>aus GPS des Handys, WLAN-Netzen und IP-Adresse – nur hier auf der Admin-Seite. Für die IP fragt der Server ipwho.is.</span></div><input type="checkbox" class="sw" id="s_geo"></div>'+
   '<div class="set"><div class="t"><b>Ortung über WLAN</b><span id="s_wli">Google Geolocation API (Schlüssel aus der Google Cloud Console) und/oder WiGLE (wigle.net → Account → API-Name:Token). Leer lassen = bleibt, „aus“ = entfernen.</span></div><div class="pw">'+
   '<input type="password" id="s_gk" placeholder="Google-Schlüssel" autocomplete="off"><input type="password" id="s_wk" placeholder="WiGLE Name:Token" autocomplete="off"></div></div>'+
   '<div class="set"><div class="t"><b>Admin-Passwort ändern</b><span id="s_pwi">mindestens 8 Zeichen · leer lassen = bleibt</span></div><div class="pw">'+
   '<input type="password" id="s_pwold" placeholder="Bisheriges Passwort" autocomplete="current-password"><input type="password" id="s_pw" placeholder="Neues Passwort" autocomplete="new-password"><input type="password" id="s_pw2" placeholder="Wiederholen" autocomplete="new-password"></div></div>'+
   '<div class="set"><div class="t"><b>Update-Quelle (GitHub)</b><span id="s_upi">Repo, aus dem der Server neue Apps holt. Ändern nur mit dem Admin-Passwort; im neuen Repo muss dist/update.json mit gültiger Signatur liegen.</span></div><div class="pw">'+
   '<input type="text" id="s_repo" placeholder="besitzer/name" autocomplete="off" spellcheck="false"><input type="text" id="s_branch" placeholder="Zweig (main)" autocomplete="off" spellcheck="false"><input type="password" id="s_upw" placeholder="Admin-Passwort zum Bestätigen" autocomplete="current-password"></div></div>'+
   '<div class="setfoot"><button class="btn" id="s_ok">Speichern</button><span class="mute" id="s_msg"></span></div>'+
   '<div id="setrs" hidden><span style="flex:1;min-width:14em"><b>Neustart nötig</b> – Leistungsmodus bzw. Admin-Seite gelten erst nach einem Neustart des Servers. Verbundene Geräte sind dabei kurz (ein paar Sekunden) getrennt.</span>'+
   '<button type="button" class="btn2" id="s_rs" style="margin:0">Server jetzt neu starten</button></div></form></div>'+
   '<div id="uplbox" hidden><h2>Eigenes Bild</h2><div class="card"><div class="upl"><img id="uplprev" alt="" hidden>'+
   '<label>Bild auswählen …<input type="file" id="uplf" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label>'+
   '<button id="upldel" hidden>Bild entfernen</button><span class="mute" id="uplmsg">PNG, JPG, WebP oder GIF, höchstens 2 MB. Erscheint auf der Download- und Statistik-Seite. Ändern geht nur hier auf dem Server (localhost).</span></div></div></div>'+
   '<div class="foot" id="foot"></div>';
  const tabs=()=>document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('act',x.dataset.r===RANGE));
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{RANGE=b.dataset.r;try{localStorage.setItem('kvpn-range',RANGE)}catch(e){}tabs();LC.key='';render(LAST)});
  tabs();$('#updok').onclick=approveUpdate;BUILT=true;TABKEY='';LC.key='';DC.key='';LOGOV=-1;
  $('#uplf').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#uplmsg').textContent='lade hoch …';
    try{const r=await fetch(BASE+'logo',{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});const k=await r.json().catch(()=>({}));
      $('#uplmsg').textContent=k.ok?'Gespeichert.':(k.err||('Fehler '+r.status));}catch(x){$('#uplmsg').textContent=x.message}
    e.target.value='';load()};
  $('#upldel').onclick=async()=>{await fetch(BASE+'logo',{method:'DELETE'}).catch(()=>{});$('#uplmsg').textContent='Bild entfernt.';load()};
}

function render(d){
  if(!BUILT)build();

  if(s.logo!==LOGOV){LOGOV=s.logo;const src=s.logo?BASE+'logo?v='+s.logo:'';
    const lg=$('#lg');lg.hidden=!s.logo;if(s.logo)lg.src=src;
    if(s.logo)$('#fav').href=src;const pv=$('#uplprev');if(pv){pv.hidden=!s.logo;if(s.logo)pv.src=src}const dl=$('#upldel');if(dl)dl.hidden=!s.logo}
  $('#uplbox').hidden=!d.local;LOCAL=!!d.local;
  const ia=d.inactive||[];setT($('#inact'),ia.length?'Gesperrt oder abgelaufen (Benutzerverwaltung): '+ia.map(x=>x.name+(x.user?' ('+x.user+')':'')).join(', '):'');

    setT($('#upds'),'Verteilt wird gerade: '+(u.offered||'noch keine')+'. Die neue Version geht erst nach deiner Freigabe an die Geräte'+(d.local?'.':' – auf dem Server: kvpn-server update (oder hier unter http://localhost:8180).'));
    $('#updok').hidden=!d.local}}
  const vt=$('#vtag'),av=(d.update&&d.update.apps)||s.version;vt.hidden=false;
  setT(vt,'v'+s.version+(av!==s.version?' · Apps v'+av:''));vt.title='Server-Version '+s.version+' · App-Version für die Geräte: '+av+(d.update&&d.update.pending?' · auf GitHub schon '+d.update.pending:'');
  APPV=av;APPVS=(d.update&&d.update.app_versions)||{};

  const down=d.peers.reduce((a,p)=>a+p.rate_tx,0), up=d.peers.reduce((a,p)=>a+p.rate_rx,0);
  const today=d.peers.reduce((a,p)=>a+p.today[0]+p.today[1],0), month=d.peers.reduce((a,p)=>a+p.month[0]+p.month[1],0);
  setT($('#sub'),on.length+' von '+d.peers.length+' Geräten verbunden (max. '+d.max_peers+') · aktualisiert sich alle 2 Sekunden');
  setT($('#kOn'),on.length+' / '+d.peers.length);setT($('#kDown'),rate(down));setT($('#kUp'),rate(up));
  setT($('#kToday'),bytes(today));setT($('#kMonth'),bytes(month));
  setT($('#kSrv'),s.cpu_pct.toFixed(1)+' % CPU');setT($('#kSrvs'),s.rss_mb.toFixed(0)+' MB RAM · '+s.queues+' Queues / '+s.cores+' Kerne'+(d.settings&&d.settings.performance?' · Leistungsmodus':''));
  lineChart($('#chart'),RANGE==='sec'?d.sec:d.min,RANGE==='sec'?1:60,now);
  peers(d.peers,now);
  dayChart($('#days'),d.days.slice().reverse());
  daysTable($('#dtable'),d);
  setT($('#foot'),(s.name||'KroneVPN')+' '+s.version+' · läuft seit '+dur(now-s.started)+' · Tunnel '+s.net4+(s.net6?' / '+s.net6:'')+' · MTU '+s.mtu+' · Last '+s.load+
   (s.tun_drops?' · '+s.tun_drops+' Pakete verworfen (Gerät zu langsam)':'')+' · '+s.url+
   (d.settings?' · Verschlüsselung je Gerät (AES-256-GCM oder ChaCha20) + Tarn-Schicht · Benutzerverwaltung '+(d.settings.users?'an':'aus'):''));
}

async function showCode(name){
  let dlg=$('#codedlg');
  if(!dlg){dlg=document.createElement('dialog');dlg.id='codedlg';dlg.className='code';document.body.appendChild(dlg);
    dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()})}
  let item=null;
  try{const r=await fetch(BASE+'codes',{cache:'no-store'});item=((await r.json()).codes||[]).find(x=>x.name===name)}catch(e){}
  if(item&&item.code){
    dlg.innerHTML='<h3 style="margin:0 0 10px">'+esc(name)+'</h3><div class="qr">'+item.svg+'</div>'+
      '<textarea rows="4" readonly>'+esc(item.code)+'</textarea><div class="mute" style="font-size:12.5px;margin-top:6px">Geheim halten – wer den Code hat, kann sich als dieses Gerät verbinden.</div>'+
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn2" data-a="copy">Kopieren</button><button class="btn" data-a="close">Schließen</button></div>';
  }else{
    dlg.innerHTML='<h3 style="margin:0 0 10px">'+esc(name)+'</h3><p class="mute">Für dieses Gerät ist kein Code auf dem Server gespeichert (vor Version 1.0.1 angelegt). '+
      'Die Apps zeigen ihn ab 1.1.0 nicht mehr an. Bei Bedarf neu anlegen: <code>kvpn-server remove &lt;name&gt;</code> und <code>kvpn-server add &lt;name&gt;</code></p>'+
      '<div style="display:flex;justify-content:flex-end"><button class="btn" data-a="close">Schließen</button></div>';
  }
  dlg.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(b.dataset.a==='close')dlg.close();else{const t=dlg.querySelector('textarea');t.select();
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{b.textContent='Kopiert ✓'},()=>{document.execCommand('copy');b.textContent='Kopiert ✓'})}});
  dlg.showModal();
}
// Geraet still anpingen (der VPN-Kern antwortet selbst – auf dem Geraet erscheint nichts) bzw. jetzt orten
async function devPost(what,name){const r=await fetch(BASE+what+'/'+encodeURIComponent(name),{method:'POST'});return r.json()}
function btnMsg(b,t,ms){const alt=b.dataset.t||b.textContent;b.dataset.t=alt;b.textContent=t;clearTimeout(b._t);b._t=setTimeout(()=>{b.textContent=alt;b.disabled=false},ms||6000)}
async function pingDev(name,b){
  b.disabled=true;b.textContent='📶 …';
  try{const r=await devPost('ping',name);btnMsg(b,r.ok?'📶 Antwort in '+String(r.ms).replace('.',',')+' ms':'📶 '+(r.err||'Fehler'),r.ok?6000:9000)}
  catch(e){btnMsg(b,'📶 Fehler: '+e.message)}
}
async function ortDev(name,b){
  b.disabled=true;b.textContent='📍 …';
  try{const r=await devPost('orten',name);
    if(!r.ok){btnMsg(b,'📍 '+(r.err||'Fehler'));return}
    btnMsg(b,'📍 angefordert – Standort kommt gleich',15000);
    // die naechsten Sekunden oefter nachladen; offene Karte zeigt den neuen Punkt dann auch
    for(const t of [3000,7000,12000,20000])setTimeout(()=>{clearTimeout(T);load();const d=$('#mapdlg');if(d&&d.open&&d.dataset.name===name)showMap(name,+(d.querySelector('[aria-pressed="true"]')||{dataset:{t:7}}).dataset.t)},t);
  }catch(e){btnMsg(b,'📍 Fehler: '+e.message)}
}
// Bewegungs-Karte: Standort-Verlauf eines Geraets (GPS des Handys, WLAN-Ortung, IP) – Leaflet kommt vom Server selbst
let LF=null,MAP=null,MAPT=0;
function loadLeaflet(){
  if(window.L)return Promise.resolve();if(LF)return LF;
  LF=new Promise((ok,err)=>{const c=document.createElement('link');c.rel='stylesheet';c.href=BASE+'leaflet.css';document.head.appendChild(c);
    const sc=document.createElement('script');sc.src=BASE+'leaflet.js';sc.onload=ok;sc.onerror=()=>{LF=null;err(new Error('Karte konnte nicht geladen werden'))};document.head.appendChild(sc)});
  return LF;
}
const SRCN={gps:'GPS des Handys',wlan:'WLAN-Ortung',ip:'IP-Adresse'},SRCC={gps:'#2fb36d',wlan:'#4d7cff',ip:'#8a93a3'};
function zeit(t){return new Date(t*1000).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
async function showMap(name,tage){
  tage=tage===undefined?7:tage;
  let dlg=$('#mapdlg');
  if(!dlg){dlg=document.createElement('dialog');dlg.id='mapdlg';dlg.className='code map';document.body.appendChild(dlg);
    dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});dlg.addEventListener('close',()=>{clearInterval(MAPT);if(MAP){MAP.remove();MAP=null}})}
  const q='geraet='+encodeURIComponent(name)+'&tage='+tage;
  if(!dlg.open||dlg.dataset.name!==name){
    dlg.dataset.name=name;
    dlg.innerHTML='<div class="mh"><h3>🗺️ '+esc(name)+'</h3><div class="rng">'+[[1,'24 h'],[7,'7 Tage'],[30,'30 Tage'],[365,'1 Jahr'],[0,'Alles']].map(([d,t])=>'<button type="button" class="btn2" data-t="'+d+'">'+t+'</button>').join('')+'</div>'+
      '<a class="btn2" data-f="gpx" download>GPX</a><button type="button" class="btn" data-a="close">Schließen</button></div><div id="map"></div><div class="mi"><span data-f="info" class="mute">Lädt …</span>'+
      '<span class="lg mute"><i style="background:'+SRCC.gps+'"></i>GPS <i style="background:'+SRCC.wlan+';margin-left:8px"></i>WLAN <i style="background:'+SRCC.ip+';margin-left:8px"></i>IP</span></div>';
    dlg.querySelector('[data-a="close"]').onclick=()=>dlg.close();
    dlg.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>showMap(name,+b.dataset.t));
    if(!dlg.open)dlg.showModal();
  }
  dlg.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.t===tage)));
  dlg.querySelector('[data-f="gpx"]').href=BASE+'verlauf.gpx?'+q;
  const info=dlg.querySelector('[data-f="info"]');
  try{await loadLeaflet()}catch(e){setT(info,e.message);return}
  let r;try{r=await (await fetch(BASE+'verlauf.json?'+q,{cache:'no-store'})).json()}catch(e){setT(info,'Fehler: '+e.message);return}
  if(!r.ok){setT(info,r.err||'Fehler');return}
  if(!MAP){MAP=L.map('map',{zoomControl:true,attributionControl:true});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,referrerPolicy:'strict-origin-when-cross-origin',attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende'}).addTo(MAP);
    MAP.setView([51.2,10.4],5);MAP._kv=L.layerGroup().addTo(MAP)}
  const g=MAP._kv;g.clearLayers();
  const pts=r.punkte||[],genau=pts.filter(p=>p.src!=='ip');
  if(!pts.length){setT(info,'Noch keine Standorte in diesem Zeitraum. Sie kommen, sobald das Gerät verbunden ist (am Handy: „Standort teilen“ an).');return}
  if(genau.length>1)L.polyline(genau.map(p=>[p.lat,p.lon]),{color:'#4d7cff',weight:3,opacity:.75}).addTo(g);
  let km=0;for(let i=1;i<genau.length;i++){const a=genau[i-1],b=genau[i];km+=L.latLng(a.lat,a.lon).distanceTo([b.lat,b.lon])/1000}
  pts.forEach((p,i)=>{const last=i===pts.length-1;
    const m=L.circleMarker([p.lat,p.lon],{radius:last?8:(p.src==='ip'?5:4),color:last?'#fff':SRCC[p.src]||'#999',weight:last?3:1,fillColor:SRCC[p.src]||'#999',fillOpacity:p.src==='ip'?.45:.9}).addTo(g);
    m.bindPopup('<b>'+esc(zeit(p.t))+'</b><br>'+esc(SRCN[p.src]||p.src)+' · '+esc(accTxt(p.acc||0))+(p.ssid?'<br>WLAN „'+esc(p.ssid)+'“':'')+(p.via?' über '+esc(p.via):'')+(p.city?'<br>'+esc(p.city):'')+(last?'<br><b>letzter bekannter Standort</b>':''));
    if(last){L.circle([p.lat,p.lon],{radius:Math.min(p.acc||50,30000),color:SRCC[p.src]||'#999',weight:1,fillOpacity:.08}).addTo(g)}});
  const fit=(genau.length?genau:pts).map(p=>[p.lat,p.lon]);
  if(!dlg.dataset.fit||dlg.dataset.fit!==q){dlg.dataset.fit=q;if(fit.length===1)MAP.setView(fit[0],genau.length?16:10);else MAP.fitBounds(fit,{padding:[24,24],maxZoom:17})}
  setTimeout(()=>MAP&&MAP.invalidateSize(),60);
  const l=pts[pts.length-1];
  setT(info,pts.length+' Punkte'+(km>0.05?' · Strecke ca. '+km.toFixed(km<10?1:0).replace('.',',')+' km':'')+' · zuletzt '+zeit(l.t)+' ('+(SRCN[l.src]||l.src)+')');
  // offen lassen = alle 30 s nachladen (z. B. wenn ein Handy gestohlen wurde)
  clearInterval(MAPT);MAPT=setInterval(()=>{if(dlg.open)showMap(name,tage)},30000);
}
// Benutzerverwaltung: sperren/entsperren direkt auf der Seite (nur lokal bzw. Admin im VPN)
let MG_T=0,MG_KEY='';
async function loadMgmt(force){
  if(!force&&Date.now()-MG_T<4000)return;MG_T=Date.now();
  try{const r=await (await fetch(BASE+'users.json')).json();showMgmt(r)}catch(e){}

function showMgmt(r){
  const box=$('#mgmt');if(!box)return;
  if(!r||!r.enabled){box.hidden=true;return}
  box.hidden=false;
  if(r.msg)setT($('#mgmtmsg'),r.msg);

  const st=(t,bad)=>'<span class="badge'+(bad?' warn':' ok')+'">'+esc(t)+'</span>';
  $('#mgmtu').innerHTML=r.users.length?'<table class="resp"><thead><tr><th>Benutzer</th><th>Geräte</th><th>Status</th><th></th></tr></thead><tbody>'+
    r.users.map(u=>'<tr><td><b>'+esc(u.name)+'</b> '+st(u.disabled?'gesperrt':'aktiv',u.disabled).replace('<span','<span data-m')+(u.note?' <span class="mute">'+esc(u.note)+'</span>':'')+'</td><td data-l="Geräte">'+esc(u.devices.join(', ')||'–')+(u.max?' <span class="mute">(max. '+u.max+')</span>':'')+'</td><td class="stc">'+
      st(u.disabled?'gesperrt':'aktiv',u.disabled)+'</td><td class="act" style="text-align:right">'+btn('user',u.name,u.disabled)+'</td></tr>').join('')+'</tbody></table>'
    :'<div class="mute">Noch keine Benutzer – anlegen auf dem Server: <code>kvpn-server benutzer add "Name"</code></div>';
  $('#mgmtd').innerHTML='<table class="resp"><thead><tr><th>Gerät</th><th>Benutzer</th><th>Adresse</th><th>Status</th><th></th></tr></thead><tbody>'+
    r.devices.map(x=>'<tr><td><b>'+esc(x.name)+'</b>'+(x.online?' <span class="badge ok">online</span>':'')+' '+st(x.status,!x.active).replace('<span','<span data-m')+'</td><td data-l="Benutzer">'+esc(x.user||'–')+'</td><td data-l="Adresse">'+esc(x.ip4)+'</td><td class="stc">'+st(x.status,!x.active)+
      '</td><td class="act" style="text-align:right">'+btn('device',x.name,x.disabled)+'</td></tr>').join('')+'</tbody></table>';
  box.querySelectorAll('button[data-k]').forEach(b=>b.onclick=async()=>{
    const off=b.dataset.a==='sperren',what=(b.dataset.k==='user'?'Benutzer':'Gerät')+' „'+b.dataset.n+'“';
    if(off&&!confirm(what+' sperren?'+(b.dataset.k==='user'?' Alle seine Geräte':' Es')+' werden sofort getrennt.'))return;
    b.disabled=true;
    try{const r=await (await fetch(BASE+'manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:b.dataset.k,name:b.dataset.n,action:b.dataset.a})})).json();
      if(r.ok){MG_KEY='';showMgmt(r);MG_T=Date.now()}else{setT($('#mgmtmsg'),r.err||'Fehler');b.disabled=false}}
    catch(e){setT($('#mgmtmsg'),'Fehler: '+e.message);b.disabled=false}});
}
// Einstellungen (wie kvpn-server einstellungen) – nur lokal bzw. Admin im VPN
let SET=null,SET_T=0,SET_DIRTY=false;
async function loadSettings(force){
  if(!force&&(SET_DIRTY||Date.now()-SET_T<10000))return;SET_T=Date.now();
  try{const r=await (await fetch(BASE+'settings.json',{cache:'no-store'})).json();if(r.ok)showSettings(r)}catch(e){}
}
function showSettings(r){
  SET=r;const f=$('#setf');
  if(!f.dataset.init){f.dataset.init=1;f.onsubmit=e=>{e.preventDefault();saveSettings()};
    f.addEventListener('input',()=>{SET_DIRTY=true});$('#s_rs').onclick=restartServer}
  if(!SET_DIRTY){$('#s_name').value=r.vpn_name;$('#s_max').value=r.max_devices;$('#s_max').max=r.max_possible||250;
    $('#s_repo').value=r.update_repo||'';$('#s_branch').value=r.update_branch||'';$('#s_users').checked=r.users;$('#s_aes').checked=r.aes256;$('#s_perf').checked=r.performance;$('#s_admin').checked=r.admin_vpn;$('#s_geo').checked=!!r.geo}
  setT($('#s_maxi'),r.devices+' angelegt, möglich bis '+(r.max_possible||250));
  $('#s_gk').placeholder=r.google_geo_key?'Google: eingetragen ✓':'Google-Schlüssel';$('#s_wk').placeholder=r.wigle_api?'WiGLE: eingetragen ✓':'WiGLE Name:Token';
  setT($('#s_admi'),r.admin_vpn?(r.admin_url?'erreichbar unter '+r.admin_url+' (mit Passwort)':'an'):'aus – dann nur noch lokal auf dem Server');
  setT($('#s_pwi'),(r.admin_password_set?'festgelegt – zum Ändern das bisherige eingeben':'noch keins – jetzt festlegen')+' · schützt Admin-Seite und Update-Quelle · mind. 8 Zeichen, leer = bleibt');
  $('#s_pwold').hidden=!r.admin_password_set;
  setT($('#s_upi'),'Apps kommen von github.com/'+(r.update_repo||'?')+' (Zweig '+(r.update_branch||'?')+') · Server '+(r.server_version||'')+'. Ändern nur mit dem Admin-Passwort'+(r.admin_password_set?'':' (erst eins festlegen)')+'; im neuen Repo muss dist/update.json mit gültiger Signatur liegen.');
  $('#setrs').hidden=!r.restart_needed;$('#s_rs').hidden=!r.can_restart;
  if(r.restart_needed&&!r.can_restart)setT($('#setrs').firstChild,'Neustart nötig – bitte auf dem Server: systemctl restart krone-vpn (Docker: docker restart krone-vpn)');
}
function viaVpn(){return !/^(localhost|127\.|\[?::1)/.test(location.hostname)}
async function saveSettings(){
  if(!SET)return;const m=$('#s_msg'),b={};
  const name=$('#s_name').value.trim(),max=+$('#s_max').value,pw=$('#s_pw').value,pw2=$('#s_pw2').value;
  if(name!==SET.vpn_name)b.vpn_name=name;if(max!==SET.max_devices)b.max_devices=max;
  [['users','#s_users'],['aes256','#s_aes'],['performance','#s_perf'],['admin_vpn','#s_admin'],['geo','#s_geo']].forEach(([k,id])=>{if($(id).checked!==SET[k])b[k]=$(id).checked});
  const gk=$('#s_gk').value.trim(),wk=$('#s_wk').value.trim();if(gk)b.google_geo_key=gk;if(wk)b.wigle_api=wk;
  if(pw||pw2){if(pw!==pw2){setT(m,'Die Passwörter sind verschieden');return}if(pw.length<8){setT(m,'Das Passwort braucht mindestens 8 Zeichen');return}
    if(SET.admin_password_set&&!$('#s_pwold').value){setT(m,'Bitte das bisherige Admin-Passwort eingeben');return}b.admin_password=pw;if(SET.admin_password_set)b.admin_password_old=$('#s_pwold').value}
  const repo=$('#s_repo').value.trim(),br=$('#s_branch').value.trim()||'main';
  if(repo&&(repo!==SET.update_repo||br!==SET.update_branch)){
    if(!SET.admin_password_set){setT(m,'Zum Ändern der Update-Quelle zuerst ein Admin-Passwort festlegen');return}
    if(!$('#s_upw').value){setT(m,'Zum Ändern der Update-Quelle das Admin-Passwort eingeben');return}
    if(!confirm('Update-Quelle auf github.com/'+repo+' (Zweig '+br+') ändern? Neue Apps kommen dann von dort (weiterhin erst nach Freigabe).'))return;
    b.update_repo=repo;b.update_branch=br;b.password=$('#s_upw').value}
  if(!Object.keys(b).length){setT(m,'Nichts geändert');SET_DIRTY=false;return}
  if(b.admin_vpn===false&&viaVpn()&&!confirm('Admin-Seite im VPN ausschalten? Nach dem Neustart ist diese Seite nur noch lokal auf dem Server erreichbar.'))return;
  if(b.users===false&&!confirm('Benutzerverwaltung ausschalten? Aktive Geräte bleiben, gesperrte und abgelaufene Geräte bleiben gesperrt (nur in der Datenbank).'))return;
  const btn=$('#s_ok');btn.disabled=true;setT(m,'Speichert …');
  try{const r=await (await fetch(BASE+'settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();
    if(r.ok){SET_DIRTY=false;$('#s_pw').value=$('#s_pw2').value=$('#s_pwold').value=$('#s_upw').value=$('#s_gk').value=$('#s_wk').value='';showSettings(r);setT(m,r.msg+' ✓');SET_T=Date.now();clearTimeout(T);load()}
    else setT(m,r.err||'Fehler')}
  catch(e){setT(m,'Fehler: '+e.message)}
  btn.disabled=false;
}
async function restartServer(){
  if(!confirm('Server jetzt neu starten? Verbundene Geräte sind ein paar Sekunden getrennt und verbinden sich dann von selbst wieder.'))return;
  const b=$('#s_rs'),m=$('#s_msg'),was=LAST&&LAST.server.started;b.disabled=true;b.textContent='Startet neu …';
  try{const r=await (await fetch(BASE+'restart',{method:'POST'})).json();if(!r.ok){setT(m,r.err||'Fehler');b.disabled=false;b.textContent='Server jetzt neu starten';return}}catch(e){}
  for(let i=0;i<40;i++){await new Promise(x=>setTimeout(x,1500));
    try{const j=await (await fetch(BASE+'data.json',{cache:'no-store'})).json();if(j.server&&j.server.started!==was){setT(m,'Server neu gestartet ✓');break}}catch(e){}}
  b.disabled=false;b.textContent='Server jetzt neu starten';loadSettings(true);
}
async function approveUpdate(){

/* App-Version des Geraets: gruen = aktuell, gelb = aelter als die verteilte Version (auch getrennt: zuletzt gemeldet) */
function verBadge(p,i){
  if(!i.ver)return '';
  const cur=(APPVS||{})[i.os]||'', old=cur&&newer(cur,i.ver);
  if(!cur)return '<span class="badge">'+(p.online?'':'zuletzt ')+esc(osName(i.os))+' · v'+esc(i.ver)+'</span>';
  return '<span class="badge'+(old?' warn':' ok')+'" title="'+(old?'Update auf '+esc(cur)+' ausstehend – kommt beim nächsten Verbinden':'aktuelle Version')+'">'+
    (p.online?'':'zuletzt ')+esc(osName(i.os))+' · v'+esc(i.ver)+(old?' · Update ausstehend':' ✓')+'</span>';
}
/* ungefaehrer Standort aus der IP-Adresse (nur lokale/Admin-Seite) */
function flag(cc){return /^[A-Za-z]{2}$/.test(cc||'')?String.fromCodePoint(...[...cc.toUpperCase()].map(c=>0x1F1A5+c.charCodeAt(0))):'📍'}
/* vom Handy selbst gemeldet ("Standort teilen" in der App): WLAN-Name und Standort laut Android */
function devLine(p,now){
  const v=p.dev;if(!v)return '';
  const parts=[];
  if(v.ssid)parts.push('📶 WLAN „'+esc(v.ssid)+'“'+(v.bssid?' <span class="mute">('+esc(v.bssid)+')</span>':''));
  if(v.lat!==undefined&&v.lon!==undefined){
    const age=v.t?' · '+(now-v.t<90?'gerade eben':ago(v.t,now)):'';
    parts.push('📍 Standort vom Handy'+(v.acc!==undefined?' ±'+Math.round(v.acc)+' m':'')+'<span class="mute">'+esc(age)+'</span> · '+
      '<a href="https://www.openstreetmap.org/?mlat='+v.lat+'&amp;mlon='+v.lon+'#map=17/'+v.lat+'/'+v.lon+'" target="_blank" rel="noopener noreferrer">Karte</a>');
  }
  const w=p.wlan;
  if(w&&w.lat!==undefined){
    parts.push('📡 WLAN-Ortung '+accTxt(w.acc)+' <span class="mute">über '+esc(w.via)+' · '+esc(ago(w.t,now))+'</span>'+
      (w.bssid?' · <a href="https://wigle.net/search?netid='+encodeURIComponent(w.bssid)+'" target="_blank" rel="noopener noreferrer">WiGLE-Karte</a>':''));
  }
  if(!parts.length)return '';
  return '<div title="Vom Gerät selbst gemeldet – dort unter „Standort teilen“ eingeschaltet (zuletzt empfangen '+esc(ago(v.got,now))+')">'+parts.join(' · ')+'</div>';
}
function accTxt(m){return m>=1000?'±'+(m/1000).toFixed(m>=10000?0:1).replace('.',',')+' km':'±'+Math.round(m)+' m'}
function posLine(p,now){
  const b=p.pos;if(!b)return '';
  const age=b.t?(now-b.t<90?'gerade eben':ago(b.t,now)):'';
  const z=b.acc>5000?11:b.acc>500?14:17;
  const icon=b.src==='gps'?'🛰️':b.src==='wlan'?'📶':'🌐';
  return '<div class="pos" title="Bester bekannter Standort aus allen Quellen (GPS des Handys, WLAN-Datenbanken, IP-Adresse)">'+icon+' <b>Standort '+accTxt(b.acc)+'</b> <span class="mute">· '+esc(b.label)+(age?' · '+esc(age):'')+'</span> · '+
    '<a href="https://www.openstreetmap.org/?mlat='+b.lat+'&amp;mlon='+b.lon+'#map='+z+'/'+b.lat+'/'+b.lon+'" target="_blank" rel="noopener noreferrer">Karte</a></div>';
}
function geoLine(p){
  const g=p.geo;if(!g)return '';
  const pre=p.online?'':'zuletzt: ';
  if(g.local)return '<span class="mute">📍 '+pre+'lokales Netz (gleiches Netz wie der Server)</span>';
  const place=[g.city,g.region&&g.region!==g.city?g.region:'',g.country].filter(Boolean).join(', ');
  const map=(g.lat||g.lon)?' · <a href="https://www.openstreetmap.org/?mlat='+g.lat+'&amp;mlon='+g.lon+'#map=10/'+g.lat+'/'+g.lon+'" target="_blank" rel="noopener noreferrer">Karte</a>':'';
  return (p.dev&&p.dev.lat!==undefined?'<span class="mute">Internet-Anschluss: </span>':'')+'<span title="Ungefährer Ort aus der IP-Adresse '+esc((p.info||{}).remote||'')+' – kein GPS: im Mobilfunk oder Firmennetz ist es der Ort des Netzanschlusses">'+
    flag(g.cc)+' '+esc(pre+place)+(g.isp?' <span class="mute">· '+esc(g.isp)+'</span>':'')+'</span>'+map;
}
function peers(list,now){

      '<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" role="img" aria-label="Datenrate der letzten 2 Minuten"><polyline data-f="spark" fill="none" stroke="var(--s1)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>'+
      '<div class="mute" data-f="foot"></div><div class="pbtns"><button type="button" class="btn2" data-f="pingbtn" hidden>📶 Anpingen</button><button type="button" class="btn2" data-f="ortbtn" hidden>📍 Jetzt orten</button><button type="button" class="btn2" data-f="mapbtn" hidden>🗺️ Bewegungen</button><button type="button" class="btn2" data-f="codebtn" hidden>Verbindungscode anzeigen</button></div>';
      c.querySelector('[data-f="codebtn"]').onclick=()=>showCode(p.name);c.querySelector('[data-f="mapbtn"]').onclick=()=>showMap(p.name);
      c.querySelector('[data-f="pingbtn"]').onclick=e=>pingDev(p.name,e.currentTarget);c.querySelector('[data-f="ortbtn"]').onclick=e=>ortDev(p.name,e.currentTarget);}
    if(box.children[idx]!==c)box.insertBefore(c,box.children[idx]||null);   // Reihenfolge nur bei Bedarf korrigieren
    const f=k=>c.querySelector('[data-f="'+k+'"]'), i=p.info||{};
    const dot=f('dot'),cls='dot '+(p.online?'on':'off');if(dot.getAttribute('class')!==cls)dot.setAttribute('class',cls);
    setT(f('name'),p.name);setT(f('ip'),p.ip4);
    setT(f('sub'),p.online?'verbunden seit '+dur(now-p.since)+' · von '+(i.remote||''):'getrennt · zuletzt gesehen '+ago(p.last_seen,now));
    let tls='';
    if(i.tls_issuer){tls=i.tls_trusted?'<span class="badge ok" title="Normales, öffentlich vertrauenswürdiges Zertifikat">✓ TLS direkt</span>'
      :'<span class="badge warn" title="Eine Firewall bricht HTTPS auf (z. B. Sophos). Die VPN-Daten bleiben trotzdem verschlüsselt – Noise prüft den Server.">⚠ HTTPS-Inspektion: '+esc(i.tls_issuer)+'</span>';}
    setH(f('badges'),(p.user?'<span class="badge" title="Benutzer">👤 '+esc(p.user)+'</span>':'')+verBadge(p,i)+(p.online&&i.via_proxy?'<span class="badge">über Proxy</span>':'')+
      (p.online&&i.cipher?'<span class="badge ok" title="Daten verschlüsselt mit '+(i.cipher==='aes256gcm'?'AES-256-GCM':'ChaCha20-Poly1305')+(i.ver&&!/^1\.0\./.test(i.ver)?' + Tarn-Schicht (je Verbindung neu)':'')+'">'+(i.cipher==='aes256gcm'?'AES-256':'ChaCha20')+'</span>':'')+(p.online?tls:''));
    setH(f('geo'),posLine(p,now)+devLine(p,now)+(p.geo?'<div>'+geoLine(p)+'</div>':''));
    setT(f('down'),p.online?rate(p.rate_tx):'–');setT(f('up'),p.online?rate(p.rate_rx):'–');setT(f('ping'),p.online&&p.rtt_ms?p.rtt_ms.toFixed(0)+' ms':'–');
    setT(f('today'),bytes(p.today[0]+p.today[1]));setT(f('month'),bytes(p.month[0]+p.month[1]));setT(f('total'),bytes(p.total[0]+p.total[1]));
    const a=p.spark||[],n=a.length,m=Math.max(1,...a);

    f('ortbtn').hidden=!(LOCAL&&p.online&&(p.info||{}).os==='android'&&(p.geo||p.pos||p.dev));
    setT(f('foot'),'Verbindungen: '+p.handshakes+(p.spoofed?' · '+p.spoofed+' gefälschte Pakete verworfen':''));
  });
}

/* Linien-Diagramm (eine Achse, zwei Reihen) mit Fadenkreuz-Tooltip.
   Das SVG entsteht einmal; bei neuen Daten werden nur Kurven und Achsenbeschriftung neu gesetzt. */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e}
const LC={key:'',hover:null};
function lineChart(el,data,step,now){
  const W=el.clientWidth||600,H=220,L=74,R=10,Tp=10,B=24,n=data.length;
  if(n<2){LC.key='';el.innerHTML='<div class="mute" style="padding:30px 0">Noch zu wenige Messwerte – kommt in ein paar Sekunden.</div>';return}
  const key=W+'|'+step;
  if(LC.key!==key){                                   // Geruest nur bei neuer Breite oder anderem Zeitraum
    LC.key=key;LC.hover=null;
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Datenrate: Download und Upload"><g class="ax"></g>'+
      '<path class="p1" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/><path class="p0" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>'+
      '<line class="xh" y1="'+Tp+'" y2="'+(H-B)+'" stroke="var(--mute)" stroke-width="1" visibility="hidden"/>'+
      '<circle class="d1" r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2" visibility="hidden"/><circle class="d2" r="4" fill="var(--s2)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>'+
      '<rect class="hit" x="'+L+'" y="0" width="'+(W-L-R)+'" height="'+H+'" fill="transparent" tabindex="0"/></svg><div class="tip"></div>';
    const svg=el.querySelector('svg'),hit=el.querySelector('.hit');
    const idx=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;return Math.max(0,Math.min(LC.n-1,Math.round((px-L)/(W-L-R)*(LC.n-1))))};
    hit.addEventListener('pointermove',e=>{LC.hover=idx(e);LC.show()});
    hit.addEventListener('pointerleave',()=>{LC.hover=null;LC.hide()});hit.addEventListener('blur',()=>{LC.hover=null;LC.hide()});
    hit.addEventListener('focus',()=>{LC.hover=LC.n-1;LC.show()});
    hit.addEventListener('keydown',e=>{if(LC.hover==null)return;if(e.key==='ArrowLeft')LC.hover=Math.max(0,LC.hover-1);if(e.key==='ArrowRight')LC.hover=Math.min(LC.n-1,LC.hover+1);LC.show()});
  }
  const max=niceMax(Math.max(...data.map(v=>Math.max(v[0],v[1])*8)));
  const x=i=>L+(W-L-R)*i/(n-1), y=v=>Tp+(H-Tp-B)*(1-(v*8)/max);
  let g='';
  for(let k=0;k<=4;k++){const yy=Tp+(H-Tp-B)*k/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--grid)"/>'+
    '<text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+rate(max*(1-k/4)/8)+'</text>';}
  const span=(n-1)*step, NL=W<520?2:4;
  for(let k=0;k<=NL;k++){const i=Math.round((n-1)*k/NL),dt=new Date((now-(n-1-i)*step)*1000);
    g+='<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="'+(k==0?'start':k==NL?'end':'middle')+'" font-size="11" fill="var(--mute)">'+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:span<=900?'2-digit':undefined})+'</text>';}
  const ax=el.querySelector('.ax');if(ax.dataset.h!==g){ax.innerHTML=g;ax.dataset.h=g}
  const path=s=>data.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v[s]).toFixed(1)).join('');
  el.querySelector('.p1').setAttribute('d',path(1));el.querySelector('.p0').setAttribute('d',path(0));
  const tip=el.querySelector('.tip'),xh=el.querySelector('.xh'),d1=el.querySelector('.d1'),d2=el.querySelector('.d2');
  Object.assign(LC,{n,show(){const i=Math.min(LC.hover,n-1),v=data[i],t=new Date((now-(n-1-i)*step)*1000);
      [xh,d1,d2].forEach(e=>e.setAttribute('visibility','visible'));
      xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));d1.setAttribute('cx',x(i));d1.setAttribute('cy',y(v[1]));d2.setAttribute('cx',x(i));d2.setAttribute('cy',y(v[0]));
      tip.innerHTML='<div class="mute">'+t.toLocaleTimeString('de-DE')+(step>1?' (Minutenmittel)':'')+'</div><div><span class="k" style="background:var(--s1)"></span><b>'+rate(v[1])+'</b> Download</div><div><span class="k" style="background:var(--s2)"></span><b>'+rate(v[0])+'</b> Upload</div>';
      tip.style.display='block';const px=x(i)/W*el.clientWidth;tip.style.left=Math.min(Math.max(0,px+12),el.clientWidth-tip.offsetWidth)+'px';tip.style.top='8px'},
    hide(){[xh,d1,d2].forEach(e=>e.setAttribute('visibility','hidden'));tip.style.display='none'}});
  if(LC.hover!=null)LC.show();                      // Tooltip bleibt beim Aktualisieren stehen
}

/* Tages-Balken: Download und Upload gestapelt, 2px Abstand. Geruest nur bei neuen Tagen/Breite, sonst nur Balkenhoehen. */
const DC={key:'',days:[]};
function dayChart(el,days){
  if(!days.length){DC.key='';el.innerHTML='<div class="mute" style="padding:20px 0">Noch keine Daten.</div>';return}
  const W=el.clientWidth||600,H=200,L=74,R=6,Tp=8,B=24,n=days.length,cw=(W-L-R)/n,bw=Math.max(4,Math.min(36,cw-4));
  DC.days=days;
  const key=W+'|'+days.map(d=>d.date).join(',');
  if(DC.key!==key){
    DC.key=key;
    let g='<g class="ax"></g>';
    days.forEach((d,i)=>{const cx=L+cw*(i+.5);
      g+='<path class="bd" fill="var(--s1)"/><path class="bu" fill="var(--s2)"/>'+
         '<rect x="'+(cx-cw/2)+'" y="'+Tp+'" width="'+cw+'" height="'+(H-Tp-B)+'" fill="transparent" data-i="'+i+'" class="dh" tabindex="0"/>';
      if(n<=10||i%Math.ceil(n/8)===0||i===n-1)g+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="var(--mute)">'+d.date.slice(8)+'.'+d.date.slice(5,7)+'.</text>';});
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="height:200px" role="img" aria-label="Datenmenge je Tag">'+g+'</svg><div class="tip"></div>';
    const tip=el.querySelector('.tip'),svg=el.querySelector('svg');
    el.querySelectorAll('.dh').forEach(r=>{const f=()=>{const d=DC.days[+r.dataset.i];if(!d)return;
      tip.innerHTML='<div class="mute">'+d.date.split('-').reverse().join('.')+'</div><div><span class="k" style="background:var(--s1)"></span><b>'+bytes(d.tx)+'</b> Download</div><div><span class="k" style="background:var(--s2)"></span><b>'+bytes(d.rx)+'</b> Upload</div>';
      tip.style.display='block';const bb=r.getBoundingClientRect(),sb=svg.getBoundingClientRect();tip.style.left=Math.min(Math.max(0,bb.left-sb.left+bb.width),el.clientWidth-tip.offsetWidth)+'px';tip.style.top='8px';r.setAttribute('fill','rgba(127,127,127,.08)');DC.open=f};
      const h=()=>{tip.style.display='none';r.setAttribute('fill','transparent');DC.open=null};
      r.addEventListener('pointerenter',f);r.addEventListener('focus',f);r.addEventListener('pointerleave',h);r.addEventListener('blur',h);});
  }
  const max=niceMax(Math.max(...days.map(d=>d.rx+d.tx))), y=v=>(H-Tp-B)*v/max;
  let g='';
  for(let k=0;k<=4;k++){const yy=Tp+(H-Tp-B)*k/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--grid)"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+bytes(max*(1-k/4))+'</text>';}
  const ax=el.querySelector('.ax');if(ax.dataset.h!==g){ax.innerHTML=g;ax.dataset.h=g}
  const bd=el.querySelectorAll('.bd'),bu=el.querySelectorAll('.bu');
  days.forEach((d,i)=>{const x0=L+cw*(i+.5)-bw/2,base=H-B,hd=y(d.tx),hu=y(d.rx),gap=hd>0&&hu>0?2:0;
    bd[i].setAttribute('d',hd>0?bar(x0,base-hd,bw,hd,hu>0?0:Math.min(4,hd)):'');
    bu[i].setAttribute('d',hu>0?bar(x0,base-hd-gap-hu,bw,hu,Math.min(4,hu)):'');});
  if(DC.open)DC.open();                              // offener Tooltip zeigt die neuen Werte
}
function bar(x,y,w,h,r){r=Math.min(r,w/2,h);return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'}
function daysTable(el,d){
  const names=d.peers.map(p=>p.name), key=d.days.map(x=>x.date).join(',')+'|'+names.join(',');
  if(TABKEY!==key){                                   // Geruest nur bei neuen Tagen/Geraeten
    TABKEY=key;
    el.innerHTML='<table><thead><tr><th>Tag</th><th>Download</th><th>Upload</th>'+names.map(n=>'<th>'+esc(n)+'</th>').join('')+'</tr></thead><tbody>'+
      d.days.map(x=>'<tr><td>'+esc(x.date.split('-').reverse().join('.'))+'</td>'+'<td></td>'.repeat(2+names.length)+'</tr>').join('')+'</tbody></table>';
  }
  const rows=el.querySelectorAll('tbody tr');
  d.days.forEach((x,i)=>{const c=rows[i].children;setT(c[1],bytes(x.tx));setT(c[2],bytes(x.rx));
    names.forEach((n,k)=>{const v=x.per[n];setT(c[3+k],v?bytes(v[0]+v[1]):'–')})});
}
