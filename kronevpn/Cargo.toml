[package]
name = "kronevpn"
version.workspace = true
edition.workspace = true
description = "KroneVPN Client (Windows und Linux)"
build = "build.rs"

[[bin]]
name = "kronevpn"
path = "src/main.rs"

[dependencies]
kvpn = { path = "../kvpn" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Programmfenster (unter Linux nur zum Ansehen: --features vorschau)
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"], optional = true }

[features]
vorschau = ["dep:eframe", "eframe/x11"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-service = "0.8"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }

[build-dependencies]
embed-resource = "3"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
