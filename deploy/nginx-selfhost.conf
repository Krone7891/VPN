    # Potzplitz VPN / KroneVPN – in den server-Block (Port 443, mit Zertifikat) der Domain einfuegen.
    # Tunnel: fuer Firewalls ein normaler HTTPS-Aufruf. Statistik: /vpn-statistik (Passwort: stats_password).
    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Krone-Auth "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        tcp_nodelay on;
    }
    location = /stats {
        return 302 /vpn-statistik;
    }
    location = /vpn-statistik {
        proxy_pass http://127.0.0.1:8101/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Krone-Auth "";
    }
    location /vpn-statistik/ {
        proxy_pass http://127.0.0.1:8101/stats/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Krone-Auth "";
    }
    # Gast-Einladungen (einmaliger Link mit Ablauf, ab Server 1.4.0)
    location /einladung/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Krone-Auth "";
        client_max_body_size 4k;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
